<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --primary-gradient: linear-gradient(135deg, #1f4037 0%, #99f2c8 100%);
      --hover-gradient: linear-gradient(135deg, #1a362e 0%, #84d8b4 100%);
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--primary-gradient);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
      z-index: -1;
    }
    
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
      z-index: 1;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    
    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      position: relative;
      padding-bottom: 15px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0));
      border-radius: 3px;
    }
    
    .form-control {
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 0.25rem rgba(31, 64, 55, 0.25);
    }
    
    label {
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }
    
    .btn-custom {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 30px;
      font-weight: 500;
      transition: all 0.3s ease;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-login {
      background: rgba(31, 64, 55, 0.9);
      color: white;
    }
    
    .btn-login:hover {
      background: rgba(31, 64, 55, 1);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .btn-back {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
    }
    
    .btn-back:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }
    
    #error {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid rgba(220, 53, 69, 0.3);
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .input-icon {
      position: relative;
    }
    
    .input-icon i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #1f4037;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2><i class="fas fa-user-shield"></i> Admin Portal</h2>
    <form onsubmit="loginAdmin(event)">
      <div class="mb-3">
        <label for="adminUser" class="form-label">Username</label>
        <div class="input-icon">
          <input type="text" id="adminUser" class="form-control" required placeholder="Enter admin username"/>
          <i class="fas fa-user"></i>
        </div>
      </div>
      <div class="mb-3">
        <label for="adminPass" class="form-label">Password</label>
        <div class="input-icon">
          <input type="password" id="adminPass" class="form-control" required placeholder="Enter password"/>
          <i class="fas fa-lock"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-login btn-custom">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
      <button type="button" class="btn btn-back btn-custom" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Back
      </button>
      <div id="error" class="mt-3 text-center"></div>
    </form>
  </div>

  <script>
    // Hardcoded admin credentials
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "admin123";

    function loginAdmin(event) {
      event.preventDefault();
      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value;
      const errorElement = document.getElementById("error");

      if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
        // Create a success effect before redirect
        document.querySelector('.card').style.transform = 'scale(0.95)';
        document.querySelector('.card').style.boxShadow = '0 0 30px rgba(153, 242, 200, 0.5)';
        
        setTimeout(() => {
          window.location.href = "admin_dashboard.html";
        }, 300);
      } else {
        errorElement.textContent = "Invalid admin credentials";
        errorElement.classList.add('text-danger');
        
        // Shake animation for error
        document.querySelector('.card').animate([
          { transform: 'translateX(0)' },
          { transform: 'translateX(-10px)' },
          { transform: 'translateX(10px)' },
          { transform: 'translateX(0)' }
        ], {
          duration: 300,
          iterations: 1
        });
      }
    }

    function goBack() {
      document.querySelector('.card').style.transform = 'scale(0.95)';
      setTimeout(() => {
        window.location.href = "index.html";
      }, 300);
    }
  </script>

</body>
</html>
