<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raise a Query</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --light-bg: #f8f9fa;
      --dark-text: #212529;
      --light-text: #6c757d;
      --success-color: #4cc9f0;
      --error-color: #f72585;
      --border-radius: 12px;
      --box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light-bg);
      color: var(--dark-text);
      padding: 40px;
      min-height: 100vh;
    }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    
    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: var(--primary-color);
      position: relative;
      padding-bottom: 15px;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: linear-gradient(to right, var(--primary-color), var(--accent-color));
      border-radius: 2px;
    }
    
    .form-control {
      border-radius: var(--border-radius);
      padding: 15px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      font-size: 16px;
    }
    
    .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
    }
    
    .btn {
      border-radius: var(--border-radius);
      padding: 12px 24px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 16px;
      border: none;
    }
    
    .btn-primary {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
    }
    
    .btn-secondary {
      background-color: white;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }
    
    .btn-secondary:hover {
      background-color: rgba(67, 97, 238, 0.05);
      color: var(--secondary-color);
      border-color: var(--secondary-color);
    }
    
    label {
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
      color: var(--dark-text);
    }
    
    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }
    
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
    
    .toast {
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      border: none;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      
      .container {
        padding: 25px;
      }
      
      .button-group {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2><i class="fas fa-question-circle me-2"></i>Raise a Query</h2>

    <div class="mb-4">
      <label for="queryText"><i class="fas fa-comment-dots me-2"></i>Your Query:</label>
      <textarea class="form-control" id="queryText" rows="5" placeholder="Please describe your question or concern in detail..."></textarea>
    </div>

    <div class="button-group">
      <button class="btn btn-primary" onclick="submitQuery()">
        <i class="fas fa-paper-plane me-2"></i> Submit Query
      </button>
      <button class="btn btn-secondary" onclick="goBack()">
        <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
      </button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    let db;
    const request = indexedDB.open("StudentDB", 11);

    function showToast(message, type) {
      const toastContainer = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast show align-items-center text-white bg-${type} border-0`;
      toast.role = "alert";
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'} me-2"></i>
            ${message}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      toastContainer.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    request.onupgradeneeded = (e) => {
      db = e.target.result;

      if (!db.objectStoreNames.contains("students")) {
        db.createObjectStore("students", { keyPath: "email" });
      }

      if (!db.objectStoreNames.contains("queries")) {
        db.createObjectStore("queries", { keyPath: "id", autoIncrement: true });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
    };

    request.onerror = () => {
      showToast("Failed to open database.", "danger");
    };

    function submitQuery() {
      const queryText = document.getElementById("queryText").value.trim();
      if (!queryText) {
        showToast("Please enter your query.", "warning");
        return;
      }

      const tx1 = db.transaction("students", "readonly");
      const store1 = tx1.objectStore("students");
      const getAll = store1.getAll();

      getAll.onsuccess = () => {
        const users = getAll.result;
        const currentUser = users.find(u => u.isLoggedIn === true);
        if (!currentUser) {
          showToast("No logged-in user found.", "danger");
          return;
        }

        const queryData = {
          email: currentUser.email,
          name: currentUser.name,
          message: queryText,
          timestamp: new Date().toISOString(),
          status: "Pending"
        };

        const tx2 = db.transaction("queries", "readwrite");
        const store2 = tx2.objectStore("queries");
        const addReq = store2.add(queryData);

        addReq.onsuccess = () => {
          showToast("Query submitted successfully!", "success");
          document.getElementById("queryText").value = "";
        };

        addReq.onerror = () => {
          showToast("Failed to submit query.", "danger");
        };
      };
    }

    function goBack() {
      window.location.href = "student_dashboard.html";
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
