<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Information System</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
      max-width: 500px;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .btn-custom {
      width: 100%;
      margin-top: 20px;
      font-weight: 600;
      padding: 12px;
      border-radius: 30px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      border: none;
      font-size: 1.05rem;
    }

    .btn-custom:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }

    .btn-custom:active {
      transform: translateY(1px);
    }

    .btn-student {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white !important;
    }

    .btn-admin {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      color: white !important;
    }

    h1 {
      font-weight: 700;
      margin-bottom: 30px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      position: relative;
      padding-bottom: 15px;
      font-size: 2.2rem;
      color: #ffffff;
    }

    h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(to right, #667eea, #764ba2);
      border-radius: 3px;
    }

    .icon {
      margin-right: 10px;
      font-size: 1.2em;
    }

    .logo {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #667eea;
      text-shadow: 0 0 15px rgba(102, 126, 234, 0.7);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="logo">
            <i class="fas fa-graduation-cap"></i>
          </div>
          <h1>STUDENT INFORMATION SYSTEM</h1>
          <button class="btn btn-student btn-custom" onclick="goToStudentLogin()">
            <i class="fas fa-user-graduate icon"></i> Student Login
          </button>
          <button class="btn btn-admin btn-custom" onclick="goToAdminLogin()">
            <i class="fas fa-user-tie icon"></i> Admin Login
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function goToStudentLogin() {
      document.querySelector('.card').style.transform = 'scale(0.95)';
      setTimeout(() => {
        window.location.href = "student_login.html";
      }, 300);
    }

    function goToAdminLogin() {
      document.querySelector('.card').style.transform = 'scale(0.95)';
      setTimeout(() => {
        window.location.href = "admin_login.html";
      }, 300);
    }
  </script>

</body>
</html>
