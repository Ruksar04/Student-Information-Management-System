<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Analytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --primary-color: #4a6bff;
      --secondary-color: #6c757d;
      --text-light: rgba(255,255,255,0.9);
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--primary-gradient);
      min-height: 100vh;
      padding: 40px 20px;
      margin: 0;
      color: var(--text-light);
    }
    
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--glass-border);
      max-width: 1000px;
    }
    
    h2 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 40px;
      position: relative;
      padding-bottom: 15px;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0));
      border-radius: 3px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      height: 100%;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    .stat-card i {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: rgba(255,255,255,0.8);
    }
    
    .stat-card h4 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
    }
    
    .stat-card span {
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      display: block;
      text-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .btn {
      border-radius: 8px;
      padding: 10px 25px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-outline-secondary {
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--text-light);
    }
    
    .btn-outline-secondary:hover {
      background-color: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
    
    .text-center {
      text-align: center !important;
    }
    
    .mt-4 {
      margin-top: 1.5rem !important;
    }
    
    .row {
      --bs-gutter-x: 1.5rem;
      --bs-gutter-y: 0;
      display: flex;
      flex-wrap: wrap;
      margin-top: calc(-1 * var(--bs-gutter-y));
      margin-right: calc(-0.5 * var(--bs-gutter-x));
      margin-left: calc(-0.5 * var(--bs-gutter-x));
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }
      
      .stat-card {
        padding: 20px 15px;
      }
      
      .stat-card span {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2><i class="fas fa-chart-line me-2"></i>Dashboard Analytics</h2>

    <div class="row">
      <div class="col-md-6">
        <div class="stat-card">
          <i class="fas fa-users"></i>
          <h4>Total Students</h4>
          <span id="studentCount">0</span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="stat-card">
          <i class="fas fa-file-upload"></i>
          <h4>Documents Uploaded</h4>
          <span id="docCount">0</span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="stat-card">
          <i class="fas fa-tasks"></i>
          <h4>Assignments Posted</h4>
          <span id="assignmentCount">0</span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="stat-card">
          <i class="fas fa-bullhorn"></i>
          <h4>Notifications Sent</h4>
          <span id="notificationCount">0</span>
        </div>
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-outline-secondary" onclick="goBack()">
        <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
      </button>
    </div>
  </div>

  <script>
    let db;
    const request = indexedDB.open("StudentDB", 11);

    request.onerror = () => {
      const alert = document.createElement("div");
      alert.className = "alert alert-danger mb-4";
      alert.innerHTML = `
        <i class="fas fa-exclamation-circle me-2"></i>Failed to open database
      `;
      document.querySelector(".container").prepend(alert);
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      countAllStats();
      
      // Animate numbers when loaded
      setTimeout(() => {
        animateNumbers();
      }, 500);
    };

    function countAllStats() {
      countRecords("students", "studentCount");
      countRecords("documents", "docCount");
      countRecords("assignments", "assignmentCount");
      countRecords("notifications", "notificationCount");
    }

    function countRecords(storeName, elementId) {
      if (!db.objectStoreNames.contains(storeName)) {
        document.getElementById(elementId).textContent = "0";
        return;
      }

      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const countReq = store.count();

      countReq.onsuccess = () => {
        document.getElementById(elementId).textContent = countReq.result;
      };

      countReq.onerror = () => {
        document.getElementById(elementId).textContent = "0";
      };
    }

    function animateNumbers() {
      const counters = document.querySelectorAll(".stat-card span");
      const speed = 200;
      
      counters.forEach(counter => {
        const target = +counter.innerText;
        const count = +counter.innerText;
        const increment = target / speed;
        
        if(count < target) {
          counter.innerText = Math.ceil(count + increment);
          setTimeout(animateNumbers, 1);
        } else {
          counter.innerText = target;
        }
      });
    }

    function goBack() {
      window.location.href = "admin_dashboard.html";
    }
  </script>

</body>
</html>
