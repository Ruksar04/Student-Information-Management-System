<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-dark: #2b2d42;
      --text-light: #6c757d;
      --border-radius: 12px;
      --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s ease;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f9ff, #e6f0ff);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 40px 20px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 40px;
      box-shadow: var(--box-shadow);
      max-width: 500px;
      width: 100%;
    }
    
    h2 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 30px;
      color: var(--primary-color);
      position: relative;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      border-radius: 2px;
    }
    
    .form-control {
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: var(--border-radius);
      padding: 15px;
      transition: var(--transition);
      margin-bottom: 20px;
    }
    
    .form-control:focus {
      background-color: white;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
    }
    
    .form-control::placeholder {
      color: var(--text-light);
    }
    
    .input-group-text {
      background-color: rgba(67, 97, 238, 0.1);
      border: none;
      color: var(--primary-color);
    }
    
    .btn {
      border-radius: var(--border-radius);
      padding: 12px;
      font-weight: 500;
      transition: var(--transition);
      width: 100%;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      border: none;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
    }
    
    .alert {
      border-radius: var(--border-radius);
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .alert-danger {
      background-color: rgba(244, 67, 54, 0.1);
      border: 1px solid #F44336;
      color: #F44336;
    }
    
    .alert-success {
      background-color: rgba(76, 175, 80, 0.1);
      border: 1px solid #4CAF50;
      color: #4CAF50;
    }
    
    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    
    .login-footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }
    
    @media (max-width: 576px) {
      body {
        padding: 20px;
      }
      
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-user-graduate me-2"></i>Student Login</h2>
    
    <div id="alertContainer"></div>
    
    <div class="mb-3">
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required />
      </div>
    </div>
    
    <div class="mb-4">
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
      </div>
    </div>
    
    <button class="btn btn-primary" onclick="login()">
      <i class="fas fa-sign-in-alt me-2"></i> Login
    </button>
    
    <div class="login-footer mt-3">
      <a href="#">Forgot password?</a> | <a href="#">Contact support</a>
    </div>
  </div>

  <script>
    let db;
    const request = indexedDB.open("StudentDB", 11);

    function showAlert(message, type) {
      const alertContainer = document.getElementById("alertContainer");
      const alert = document.createElement("div");
      alert.className = `alert alert-${type}`;
      alert.innerHTML = `
        <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} me-2"></i>
        ${message}
      `;
      alertContainer.appendChild(alert);
      
      setTimeout(() => {
        alert.remove();
      }, 3000);
    }

    request.onsuccess = (e) => {
      db = e.target.result;
    };

    request.onerror = () => {
      showAlert("Failed to connect to database", "danger");
    };

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAlert("Please enter both email and password", "danger");
        return;
      }

      const tx = db.transaction("students", "readwrite");
      const store = tx.objectStore("students");
      const req = store.get(email);

      req.onsuccess = () => {
        const user = req.result;

        if (!user || user.password !== password) {
          showAlert("Invalid email or password", "danger");
          return;
        }

        // Set login session
        localStorage.setItem("loggedInEmail", email);
        user.isLoggedIn = true;
        store.put(user);

        showAlert("Login successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "student_dashboard.html";
        }, 1500);
      };

      req.onerror = () => {
        showAlert("Login failed. Please try again.", "danger");
      };
    }
  </script>
</body>
</html>
