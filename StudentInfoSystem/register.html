<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --light-bg: #f8f9fa;
      --dark-bg: #1a1a2e;
      --form-bg: rgba(255, 255, 255, 0.05);
      --text-light: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --success-color: #4cc9f0;
      --error-color: #f72585;
      --border-radius: 12px;
      --box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      --transition: all 0.3s ease;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    
    .container {
      background: var(--form-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--border-radius);
      padding: 40px;
      box-shadow: var(--box-shadow);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    
    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: var(--text-light);
      position: relative;
      padding-bottom: 15px;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: linear-gradient(to right, var(--primary-color), var(--accent-color));
      border-radius: 2px;
    }
    
    .form-control {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-light);
      border-radius: var(--border-radius);
      padding: 12px 15px;
      transition: var(--transition);
    }
    
    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.25rem rgba(72, 149, 239, 0.25);
      color: var(--text-light);
    }
    
    .form-control::placeholder {
      color: var(--text-muted);
    }
    
    label {
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
      color: var(--text-light);
    }
    
    .btn {
      border-radius: var(--border-radius);
      padding: 12px 24px;
      font-weight: 500;
      transition: var(--transition);
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-success {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
    }
    
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
    }
    
    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-light);
    }
    
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: var(--text-light);
    }
    
    .btn-outline-light {
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .btn-outline-light:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
    }
    
    #message {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      border-radius: var(--border-radius);
      font-weight: 500;
      transition: var(--transition);
    }
    
    .success-message {
      background-color: rgba(76, 201, 240, 0.1);
      color: var(--success-color);
      border: 1px solid var(--success-color);
    }
    
    .error-message {
      background-color: rgba(247, 37, 133, 0.1);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }
    
    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 25px;
      }
      
      .button-group {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2><i class="fas fa-user-graduate me-2"></i>Register New Student</h2>

    <form id="registerForm">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label><i class="fas fa-user me-2"></i>Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter full name" required />
        </div>
        <div class="col-md-6 mb-3">
          <label><i class="fas fa-phone me-2"></i>Phone Number</label>
          <input type="text" id="phone" class="form-control" placeholder="Enter phone number" required />
        </div>
        <div class="col-md-6 mb-3">
          <label><i class="fas fa-envelope me-2"></i>Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter email address" required />
        </div>
        <div class="col-md-6 mb-3">
          <label><i class="fas fa-building me-2"></i>Department</label>
          <input type="text" id="department" class="form-control" placeholder="Enter department" required />
        </div>
        <div class="col-md-4 mb-3">
          <label><i class="fas fa-layer-group me-2"></i>Semester</label>
          <input type="number" id="semester" class="form-control" min="1" max="8" placeholder="Semester" required />
        </div>
        <div class="col-md-4 mb-3">
          <label><i class="fas fa-id-card me-2"></i>Roll Number</label>
          <input type="text" id="roll" class="form-control" placeholder="Enter roll number" required />
        </div>
        <div class="col-md-4 mb-3">
          <label><i class="fas fa-id-badge me-2"></i>USN</label>
          <input type="text" id="usn" class="form-control" placeholder="Enter USN" required />
        </div>
        <div class="col-md-6 mb-3">
          <label><i class="fas fa-lock me-2"></i>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create password" required />
        </div>
        <div class="col-md-6 mb-3">
          <label><i class="fas fa-lock me-2"></i>Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required />
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-success">
          <i class="fas fa-user-plus me-1"></i> Register
        </button>
        <button type="button" class="btn btn-secondary" onclick="clearForm()">
          <i class="fas fa-times me-1"></i> Cancel
        </button>
        <button type="button" class="btn btn-outline-light" onclick="goBack()">
          <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
        </button>
      </div>

      <div id="message"></div>
    </form>
  </div>

  <script>
    let dbReady = false;
    let db;

    const request = indexedDB.open("StudentDB", 11);

    function showMessage(message, isSuccess) {
      const messageDiv = document.getElementById("message");
      messageDiv.textContent = message;
      messageDiv.className = isSuccess ? "success-message" : "error-message";
      
      if (isSuccess) {
        setTimeout(() => {
          messageDiv.textContent = "";
          messageDiv.className = "";
        }, 3000);
      }
    }

    request.onerror = () => {
      showMessage("Failed to open database", false);
    };

    request.onupgradeneeded = (event) => {
      db = event.target.result;

      if (!db.objectStoreNames.contains("students")) {
        const studentStore = db.createObjectStore("students", { keyPath: "email" });
        studentStore.createIndex("name", "name", { unique: false });
      }

      if (!db.objectStoreNames.contains("documents")) {
        db.createObjectStore("documents", { keyPath: "id" });
      }
    };

    request.onsuccess = (event) => {
      db = event.target.result;
      dbReady = true;
    };

    document.getElementById("registerForm").addEventListener("submit", function (e) {
      e.preventDefault();

      if (!dbReady) {
        showMessage("Please wait, database is still loading...", false);
        return;
      }

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const dept = document.getElementById("department").value.trim();
      const semester = parseInt(document.getElementById("semester").value);
      const roll = document.getElementById("roll").value.trim();
      const usn = document.getElementById("usn").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Passwords do not match!", false);
        return;
      }

      const tx = db.transaction("students", "readwrite");
      const store = tx.objectStore("students");

      const newStudent = {
        name,
        phone,
        email,
        department: dept,
        semester,
        roll,
        usn,
        password,
        isLoggedIn: false
      };

      const addReq = store.add(newStudent);

      addReq.onsuccess = () => {
        showMessage("Student registered successfully!", true);
        document.getElementById("registerForm").reset();
      };

      addReq.onerror = (event) => {
        if (event.target.error.name === "ConstraintError") {
          showMessage("This email is already registered", false);
        } else {
          showMessage("Failed to register student", false);
        }
        console.error("Error adding student:", event.target.error);
      };
    });

    function clearForm() {
      document.getElementById("registerForm").reset();
      document.getElementById("message").textContent = "";
      document.getElementById("message").className = "";
    }

    function goBack() {
      window.location.href = "admin_dashboard.html";
    }
  </script>

</body>
</html>
